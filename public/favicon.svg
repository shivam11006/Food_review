<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Background circle -->
  <circle cx="32" cy="32" r="30" fill="#16A34A"/>

  <!-- Plate circle -->
  <circle cx="32" cy="34" r="16" fill="white" opacity="0.95"/>
  <circle cx="32" cy="34" r="13" fill="none" stroke="#16A34A" stroke-width="1.5" opacity="0.3"/>

  <!-- Fork (left) -->
  <g transform="translate(24, 18) rotate(-15, 5, 16)">
    <!-- Fork handle -->
    <rect x="4" y="18" width="2.5" height="12" rx="1.2" fill="#16A34A"/>
    <!-- Fork tines -->
    <rect x="2.5" y="8" width="1" height="10" rx="0.5" fill="#16A34A"/>
    <rect x="4.3" y="8" width="1" height="10" rx="0.5" fill="#16A34A"/>
    <rect x="6" y="8" width="1" height="10" rx="0.5" fill="#16A34A"/>
    <!-- Fork neck -->
    <rect x="3.5" y="17" width="3" height="2" rx="0.5" fill="#16A34A"/>
  </g>

  <!-- Spoon (right) -->
  <g transform="translate(34, 17) rotate(15, 5, 16)">
    <!-- Spoon handle -->
    <rect x="3.5" y="20" width="2.5" height="12" rx="1.2" fill="#16A34A"/>
    <!-- Spoon bowl -->
    <ellipse cx="4.8" cy="13" rx="3.5" ry="5" fill="#16A34A"/>
    <ellipse cx="4.8" cy="13" rx="2.2" ry="3.3" fill="white" opacity="0.4"/>
  </g>

  <!-- Star badge top-right -->
  <circle cx="48" cy="16" r="9" fill="#F59E0B"/>
  <text x="48" y="20.5" text-anchor="middle" font-size="12" fill="white" font-family="sans-serif">★</text>
</svg>